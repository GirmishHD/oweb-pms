# Render Blueprint Specification for Oromia Water & Energy Bureau (OWEB)
# Program Based Project Management System (PB-PMS)
# Target Render Account: gimmyphp@gmail.com

services:
  # ============================================================================
  # 1. DJANGO REST BACKEND WEB SERVICE
  # ============================================================================
  - type: web
    name: oweb-backend
    runtime: python
    region: frankfurt  # or oregon / ohio / singapore
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: oweb-postgres
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOW_ALL
        value: "True"
      - key: INITIAL_ADMIN_USERNAME
        value: admin
      - key: INITIAL_ADMIN_EMAIL
        value: admin@oweb.gov.et
      - key: INITIAL_ADMIN_PASSWORD
        value: admin

  # ============================================================================
  # 2. REACT VITE FRONTEND STATIC SITE
  # ============================================================================
  - type: web
    name: oweb-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        value: https://oweb-backend.onrender.com/api

# ============================================================================
# 3. MANAGED POSTGRESQL DATABASE
# ============================================================================
databases:
  - name: oweb-postgres
    region: frankfurt
    plan: free
    databaseName: oweb_pms
    user: oweb_admin

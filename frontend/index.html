<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OWEB Program-Based Project Management System</title>
    <meta name="description" content="A comprehensive system for managing OWEB projects from planning and feasibility study through to procurement, contract management, GIS regional geospatial asset mapping, and field quality assurance (QA/QC) inspection logbooks with water quality testing and defect punch lists." />
    <meta property="og:title" content="OWEB Program-Based Project Management System" />
    <meta property="og:description" content="A comprehensive system for managing OWEB projects from planning and feasibility study through to procurement, contract management, GIS regional geospatial asset mapping, and field quality assurance (QA/QC) inspection logbooks with water quality testing and defect punch lists." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
      body {
        font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f0f7fc;
      }
      .font-mono, .tabular-nums {
        font-family: 'JetBrains Mono', monospace;
        font-variant-numeric: tabular-nums;
      }
      .font-display {
        font-family: 'Outfit', sans-serif;
      }
      @media print {
        body {
          background-color: white !important;
        }
        #root > div > aside, 
        #root > div > div > header,
        #root > div > div > footer {
          display: none !important;
        }
        main {
          padding: 0 !important;
          overflow: visible !important;
        }
        .no-print {
          display: none !important;
        }
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fade-in 0.3s ease-out forwards;
      }
      @keyframes slide-in {
        0% {
          opacity: 0;
          transform: translateY(10px) scale(0.996);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .animate-slide-in {
        animation: slide-in 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes fade-in-up {
          0% {
              opacity: 0;
              transform: translateY(10px);
          }
          100% {
              opacity: 1;
              transform: translateY(0);
          }
      }
      .animate-fade-in-up {
          animation: fade-in-up 0.5s ease-out forwards;
      }
      @keyframes scale-in {
          0% {
              opacity: 0;
              transform: scale(0.95);
          }
          100% {
              opacity: 1;
              transform: scale(1);
          }
      }
      .animate-scale-in {
          animation: scale-in 0.3s ease-out forwards;
      }
      .animate-fade-in-down {
        animation: fade-in-down 0.3s ease-out forwards;
      }
      @keyframes fade-in-down {
        0% {
          opacity: 0;
          transform: translateY(-10px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>

            },
            boxShadow: {
              'sm': '0 1px 2px 0 rgb(0 0 0 / 0.05)',
              'DEFAULT': '0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1)',
              'md': '0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1)',
              'lg': '0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1)',
              'xl': '0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1)',
            },
            animation: {
              'fade-in': 'fade-in 0.3s ease-out forwards',
              'fade-in-up': 'fade-in-up 0.5s ease-out forwards',
              'scale-in': 'scale-in 0.3s ease-out forwards',
              'fade-in-down': 'fade-in-down 0.3s ease-out forwards',
            },
            keyframes: {
              'fade-in': { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              'fade-in-up': { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
              'scale-in': { '0%': { opacity: '0', transform: 'scale(0.95)' }, '100%': { opacity: '1', transform: 'scale(1)' } },
              'fade-in-down': { '0%': { opacity: '0', transform: 'translateY(-10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
            },
          },
        }
      }
